<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="MOUSSERIE — موسيريا">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6B684"/>
      <stop offset="0.5" stop-color="#A97C3F"/>
      <stop offset="1" stop-color="#D6B684"/>
    </linearGradient>
  </defs>

  <!-- emblem: mousse dome on a plate with a cream drop above -->
  <g transform="translate(52 42)" fill="none" stroke="#2A1A12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 74C4 47.5 21.5 27 46 27s42 20.5 42 47" stroke-width="4"/>
    <path d="M19 74c0-17.5 12-31 27-31s27 13.5 27 31" stroke-width="1.9" opacity=".42"/>
    <path d="M46 27.6c0-9.6-10.6-8.3-10.6-17.2C35.4 3.6 41.4 1.4 46-5c4.6 6.4 10.6 8.6 10.6 15.4 0 8.9-10.6 7.6-10.6 17.2Z" stroke-width="3.4"/>
    <path d="M-6 78h104" stroke="url(#gold)" stroke-width="4"/>
    <path d="M9 89h74" stroke="#A97C3F" stroke-width="2" opacity=".5"/>
  </g>

  <!-- wordmark -->
  <text x="168" y="98"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="52" font-weight="500" letter-spacing="11" fill="#2A1A12">MOUSSERIE</text>

  <!-- gold hairline -->
  <path d="M170 118h300" stroke="url(#gold)" stroke-width="1.6"/>

  <!-- arabic lockup -->
  <text x="470" y="152" text-anchor="end"
        font-family="'Aref Ruqaa', 'Amiri', serif"
        font-size="30" fill="#7C6455" letter-spacing="2">موسيريا</text>
</svg>
